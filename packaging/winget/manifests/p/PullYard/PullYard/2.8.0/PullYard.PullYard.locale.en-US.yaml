ShortDescription: Pull requests, without the browser. A tiny native GitHub client with a Claude Code workspace.
Description: |-
  PullYard is a native GitHub pull request client for Windows, macOS and Linux.
  Review conversations, commits, checks and changed files; comment, approve, request changes and merge; follow notifications, issues, repositories with git blame and GitHub Projects boards, all without opening a browser.
  A built-in Claude Code workspace puts a native chat for the Claude Code CLI next to the pull request, its changed files and its branch, with one-click "Fix with Claude Code" from review feedback.
