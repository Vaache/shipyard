name: Windows

on:
  push:
    branches: [windows-port, main]
    tags: ['v*']
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Core tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x

      - name: Check localized strings
        run: python windows/tools/strings.py --check

      - name: Run unit tests
        run: dotnet test windows/tests/PullYard.Core.Tests/PullYard.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
          - arch: arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x

      - name: Read branding
        id: brand
        shell: pwsh
        run: |
          [xml]$props = Get-Content windows/Branding.props
          $p = $props.Project.PropertyGroup
          $version = $p.BrandVersion
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF_NAME.TrimStart('v', 'V') }
          "name=$($p.BrandDisplayName)" >> $env:GITHUB_OUTPUT
          "appid=$($p.BrandAppId)" >> $env:GITHUB_OUTPUT
          "exe=$($p.BrandExeName)" >> $env:GITHUB_OUTPUT
          "publisher=$($p.BrandPublisher)" >> $env:GITHUB_OUTPUT
          "scheme=$($p.BrandUrlScheme)" >> $env:GITHUB_OUTPUT
          "envprefix=$($p.BrandEnvPrefix)" >> $env:GITHUB_OUTPUT
          "repo=https://github.com/$($p.BrandGitHubOwner)/$($p.BrandGitHubRepo)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building $($p.BrandDisplayName) $version for ${{ matrix.arch }}"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish windows/src/PullYard/PullYard.csproj `
            -c Release `
            -r win-${{ matrix.arch }} `
            -p:Platform=${{ matrix.platform }} `
            -p:Version=${{ steps.brand.outputs.version }} `
            -o windows/dist/${{ matrix.arch }}/app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem windows/dist/${{ matrix.arch }}/app | Select-Object -First 40 Name, Length | Format-Table | Out-String | Write-Host

      - name: Smoke test (version and self test)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $exe = "windows/dist/x64/app/${{ steps.brand.outputs.exe }}.exe"
          foreach ($arg in @('--version', '--self-test')) {
            $p = Start-Process -FilePath $exe -ArgumentList $arg -Wait -PassThru -NoNewWindow -RedirectStandardOutput "out$arg.txt" -RedirectStandardError "err$arg.txt"
            Get-Content "out$arg.txt" | Write-Host
            Get-Content "err$arg.txt" | Write-Host
            if ($p.ExitCode -ne 0) { throw "$arg exited with $($p.ExitCode)" }
          }
          $version = Get-Content "out--version.txt" -Raw
          if ($version -notmatch [regex]::Escape("${{ steps.brand.outputs.version }}")) { throw "Unexpected version output: $version" }

      - name: Smoke test (window)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $exe = "windows/dist/x64/app/${{ steps.brand.outputs.exe }}.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-ui' -PassThru
          if (-not $p.WaitForExit(120000)) {
            Stop-Process -Id $p.Id -Force
            throw "UI smoke test timed out"
          }
          $log = Join-Path $env:LOCALAPPDATA "${{ steps.brand.outputs.name }}\errors.log"
          if (Test-Path $log) { Get-Content $log | Write-Host }
          if ($p.ExitCode -ne 0) { throw "UI smoke test exited with $($p.ExitCode)" }
          Write-Host "Window opened and closed cleanly"

      - name: UI tour with screenshots
        if: matrix.arch == 'x64'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prefix = "${{ steps.brand.outputs.envprefix }}"
          $demo = Join-Path $env:USERPROFILE "code\web-app"
          New-Item -ItemType Directory -Force -Path $demo | Out-Null
          Copy-Item -Path ".github/tour/web-app/*" -Destination $demo -Recurse -Force
          git -C $demo init -q -b main
          git -C $demo -c user.name=Demo -c user.email=demo@example.com add -A
          git -C $demo -c user.name=Demo -c user.email=demo@example.com commit -qm init
          git -C $demo checkout -qb feat/search-debounce
          Copy-Item -Path ".github/tour/useSearch.edited.ts" -Destination (Join-Path $demo "src\search\useSearch.ts") -Force
          $history = New-Item -ItemType Directory -Force -Path (Join-Path $env:USERPROFILE ".claude\projects\C--Users-runneradmin-code-web-app")
          $age = 2
          foreach ($f in Get-ChildItem ".github/tour/sessions/*.jsonl") {
            $out = Join-Path $history $f.Name
            (Get-Content $f.FullName -Raw).Replace("__DEMO__", $demo.Replace("\", "\\")) | Set-Content -Path $out -NoNewline -Encoding utf8NoBOM
            (Get-Item $out).LastWriteTime = (Get-Date).AddHours(-$age)
            $age += 20
          }
          $npm = New-Item -ItemType Directory -Force -Path (Join-Path $env:APPDATA "npm")
          Set-Content -Path (Join-Path $npm "claude.cmd") -Encoding ascii -Value @(
            '@echo off'
            'if /i "%~1"=="auth" (echo {"loggedIn":true,"authMethod":"claude.ai","email":"alex@example.com","subscriptionType":"max"}& exit /b 0)'
            'if /i "%~1"=="--version" (echo 2.1.0 ^(Claude Code^)& exit /b 0)'
            'more > nul'
          )
          Set-Item "env:${prefix}_TOKEN" $env:GH_TOKEN
          Set-Item "env:${prefix}_DEMO_REPO" "migueldeicaza/SwiftTerm"
          Set-Item "env:${prefix}_DEMO_FOLDER" $demo
          Set-Item "env:${prefix}_TOUR_CHAT" (Resolve-Path ".github/tour/claude-chat.jsonl").Path
          Set-Item "env:${prefix}_TOUR_PROMPT" "Searching quickly shows results for an older query. Cancel stale requests."
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "Display resolution unchanged: $_" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -Namespace Tour -Name Dwm -MemberDefinition '[System.Runtime.InteropServices.DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(System.IntPtr hwnd, int attr, int[] rect, int size);'
          function Save-Window($proc, $path) {
            $proc.Refresh()
            $r = New-Object int[] 4
            $h = $proc.MainWindowHandle
            if ($h -eq [IntPtr]::Zero -or [Tour.Dwm]::DwmGetWindowAttribute($h, 9, $r, 16) -ne 0) {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $r = @($b.Left, $b.Top, $b.Right, $b.Bottom)
            }
            $bmp = New-Object System.Drawing.Bitmap ($r[2] - $r[0]), ($r[3] - $r[1])
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r[0], $r[1], 0, 0, $bmp.Size)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $exe = "windows/dist/x64/app/${{ steps.brand.outputs.exe }}.exe"
          $data = Join-Path $env:LOCALAPPDATA "${{ steps.brand.outputs.name }}"
          $log = Join-Path $data "tour.log"
          $link = "${{ steps.brand.outputs.scheme }}://github.com/migueldeicaza/SwiftTerm/pull/753"
          $personalize = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          if (-not (Test-Path $personalize)) { New-Item -Path $personalize -Force | Out-Null }
          $codes = @{}
          foreach ($mode in @("dark", "light")) {
            Set-ItemProperty -Path $personalize -Name AppsUseLightTheme -Value ([int]($mode -eq "light")) -Type DWord
            Remove-Item $log -ErrorAction SilentlyContinue
            $shots = New-Item -ItemType Directory -Force -Path "windows/dist/shots/$mode"
            $p = Start-Process -FilePath $exe -ArgumentList @('--smoke-tour', $link) -PassThru
            $seen = 0
            $deadline = (Get-Date).AddMinutes(4)
            while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 250
              $lines = @(Get-Content $log -ErrorAction SilentlyContinue)
              for (; $seen -lt $lines.Count; $seen++) {
                if ($lines[$seen] -match ' shot (\S+)$') { Save-Window $p (Join-Path $shots "$($Matches[1]).png") }
              }
            }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            $p.WaitForExit()
            foreach ($f in @('tour.log', 'errors.log')) { $path = Join-Path $data $f; if (Test-Path $path) { Write-Host "--- $mode $f"; Get-Content $path | Write-Host } }
            Write-Host "Exit code ($mode): $($p.ExitCode)"
            $codes[$mode] = $p.ExitCode
          }
          foreach ($mode in $codes.Keys) { if ($codes[$mode] -ne 0) { throw "UI tour ($mode) exited with $($codes[$mode])" } }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.arch == 'x64' && always()
        with:
          name: ui-tour-screenshots
          path: windows/dist/shots/*
          if-no-files-found: ignore

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $source = Resolve-Path "windows/dist/${{ matrix.arch }}/app"
          $out = New-Item -ItemType Directory -Force -Path "windows/dist/out"
          & $iscc `
            "/DAppName=${{ steps.brand.outputs.name }}" `
            "/DAppId=${{ steps.brand.outputs.appid }}" `
            "/DExeName=${{ steps.brand.outputs.exe }}" `
            "/DAppVersion=${{ steps.brand.outputs.version }}" `
            "/DPublisher=${{ steps.brand.outputs.publisher }}" `
            "/DUrlScheme=${{ steps.brand.outputs.scheme }}" `
            "/DRepoUrl=${{ steps.brand.outputs.repo }}" `
            "/DArch=${{ matrix.arch }}" `
            "/DSourceDir=$source" `
            "/DOutputDir=$($out.FullName)" `
            "/DOutputBase=${{ steps.brand.outputs.exe }}-windows-${{ matrix.arch }}-setup" `
            windows/installer/setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable zip
        shell: pwsh
        run: |
          $zip = "windows/dist/out/${{ steps.brand.outputs.exe }}-windows-${{ matrix.arch }}-portable.zip"
          Compress-Archive -Path "windows/dist/${{ matrix.arch }}/app/*" -DestinationPath $zip -CompressionLevel Optimal
          Get-ChildItem windows/dist/out | Format-Table Name, Length | Out-String | Write-Host

      - name: Test installer (silent install and uninstall)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $setup = "windows/dist/out/${{ steps.brand.outputs.exe }}-windows-x64-setup.exe"
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\${{ steps.brand.outputs.name }}"
          $exe = Join-Path $dir "${{ steps.brand.outputs.exe }}.exe"
          if (-not (Test-Path $exe)) { throw "Installed exe not found at $exe" }
          $v = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow -RedirectStandardOutput installed.txt
          Get-Content installed.txt | Write-Host
          if ($v.ExitCode -ne 0) { throw "Installed app failed" }
          $u = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstaller exited with $($u.ExitCode)" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.brand.outputs.exe }}-windows-${{ matrix.arch }}
          path: windows/dist/out/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No release for $env:GITHUB_REF_NAME yet; skipping upload"
            exit 0
          }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem windows/dist/out/*).FullName --clobber --repo $env:GITHUB_REPOSITORY
