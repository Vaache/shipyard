name: Linux

on:
  push:
    branches: [linux-port, 'linux-*']
    tags: ['v*']
  pull_request:
    paths:
      - 'linux/**'
      - 'Resources/Brand/**'
      - '.github/workflows/linux.yml'
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLATPAK_CARGO_GENERATOR: https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/74697c75b630d7330e77250fc13cb5ea688d9479/cargo/flatpak-cargo-generator.py

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "PULLYARD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev libwebkitgtk-6.0-dev \
            libgtksourceview-5-dev libssl-dev pkg-config librsvg2-bin xvfb xauth dbus-x11 \
            appstream desktop-file-utils dpkg-dev

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: linux
          key: ${{ matrix.arch }}

      - name: Unit tests
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Launch checks
        run: |
          set -a; . ./brand.env; set +a
          "./target/release/${BIN_NAME}" --version
          "./target/release/${BIN_NAME}" --help
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          export GTK_A11Y=none
          export GSK_RENDERER=cairo
          export NO_AT_BRIDGE=1
          timeout 120 xvfb-run -a -s "-screen 0 1600x1000x24" dbus-run-session -- "./target/release/${BIN_NAME}" --smoke

      - name: Packaging metadata
        run: |
          ./packaging/render.sh
          . dist/brand.out
          desktop-file-validate "dist/share/applications/${APP_ID}.desktop"
          appstreamcli validate --no-net --explain "dist/share/metainfo/${APP_ID}.metainfo.xml" || echo "::warning::appstream validation reported issues"

      - name: Debian package
        run: |
          cargo install cargo-deb --locked --quiet || true
          . dist/brand.out
          cargo deb --no-build --no-strip --deb-version "${VERSION}" --output "dist/${BIN_NAME}_${VERSION}_$(dpkg --print-architecture).deb"
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Tarball
        run: |
          . dist/brand.out
          name="${APP_NAME}-linux-${{ matrix.arch }}"
          stage="dist/stage/${name}"
          rm -rf dist/stage && mkdir -p "${stage}/bin"
          cp "target/release/${BIN_NAME}" "${stage}/bin/"
          cp -r dist/share "${stage}/share"
          cp dist/brand.out packaging/install.sh packaging/uninstall.sh "${stage}/"
          cp ../LICENSE "${stage}/"
          tar -C dist/stage -czf "dist/${name}.tar.gz" "${name}"
          ls -la dist

      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tarball-${{ matrix.arch }}
          path: linux/dist/*.tar.gz
          if-no-files-found: error

      - name: Upload deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deb-${{ matrix.arch }}
          path: linux/dist/*.deb
          if-no-files-found: error

      - name: Upload packaging metadata
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packaging
          path: |
            linux/dist/share
            linux/dist/flatpak
            linux/dist/brand.out
          if-no-files-found: error

  screenshots:
    name: UI screenshots
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: .github/tour

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tarball-x86_64
          path: dist

      - name: Runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-1 libadwaita-1-0 libvte-2.91-gtk4-0 libwebkitgtk-6.0-4 libgtksourceview-5-0 \
            xvfb xauth dbus-x11 imagemagick fonts-cantarell adwaita-icon-theme hicolor-icon-theme librsvg2-common
          mkdir -p ~/.config/gtk-4.0
          printf '[Settings]\ngtk-font-name=Cantarell 11\n' > ~/.config/gtk-4.0/settings.ini

      - name: Demo Claude Code workspace
        run: |
          mkdir -p ~/.local/bin ~/code/web-app
          printf '%s\n' '#!/bin/sh' 'case "$1" in' '  auth) echo '"'"'{"loggedIn":true,"authMethod":"claude.ai","email":"alex@example.com","subscriptionType":"max"}'"'"' ;;' '  --version|-v) echo "2.1.0 (Claude Code)" ;;' '  *) exec cat >/dev/null ;;' 'esac' > ~/.local/bin/claude
          chmod +x ~/.local/bin/claude
          cp -R .github/tour/web-app/. ~/code/web-app/
          cd ~/code/web-app
          git init -q -b main
          git -c user.name=Demo -c user.email=demo@example.com add -A
          git -c user.name=Demo -c user.email=demo@example.com commit -qm init
          git checkout -qb feat/search-debounce
          cp "$GITHUB_WORKSPACE/.github/tour/useSearch.edited.ts" src/search/useSearch.ts
          mkdir -p ~/.claude/projects/-home-runner-code-web-app
          hours=2
          for f in "$GITHUB_WORKSPACE"/.github/tour/sessions/*.jsonl; do
            out=~/.claude/projects/-home-runner-code-web-app/$(basename "$f")
            sed "s|__DEMO__|$HOME/code/web-app|g" "$f" > "$out"
            touch -d "-$hours hours" "$out"
            hours=$((hours + 20))
          done

      - name: Tour (dark and light)
        env:
          PULLYARD_TOKEN: ${{ github.token }}
          PULLYARD_DEMO_REPO: migueldeicaza/SwiftTerm
          PULLYARD_TOUR_PR: migueldeicaza/SwiftTerm#753
          PULLYARD_TOUR_CHAT: ${{ github.workspace }}/.github/tour/claude-chat.jsonl
          PULLYARD_TOUR_PROMPT: Searching quickly shows results for an older query. Cancel stale requests.
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
          GTK_A11Y: none
          GSK_RENDERER: cairo
          NO_AT_BRIDGE: '1'
        run: |
          export PULLYARD_DEMO_FOLDER="$HOME/code/web-app"
          tar -C dist -xzf dist/*.tar.gz
          bin=$(find dist -path '*/bin/*' -type f | head -1)
          for scheme in dark light; do
            ADW_DEBUG_COLOR_SCHEME="prefer-${scheme}" timeout 300 xvfb-run -a -s "-screen 0 1600x1000x24" \
              dbus-run-session -- "$bin" --tour="$PWD/shots/${scheme}" || echo "::warning::tour (${scheme}) exited with $?"
          done
          ls -la shots/*
          test -n "$(find shots -name '*.png' | head -1)"

      - name: Upload screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-screenshots
          path: shots
          if-no-files-found: error

  cargo-sources:
    name: Cargo.lock and Flathub sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable

      - name: Cargo.lock in sync
        id: lock
        working-directory: linux
        run: |
          if cargo metadata --locked --format-version 1 >/dev/null; then
            echo "linux/Cargo.lock is up to date"
          else
            cargo metadata --format-version 1 >/dev/null
            echo "::error file=linux/Cargo.lock::linux/Cargo.lock is missing or out of date. Commit the Cargo.lock from the flathub-sources artifact."
            echo "stale=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate cargo-sources.json
        run: |
          python3 -m venv "$RUNNER_TEMP/fcg"
          "$RUNNER_TEMP/fcg/bin/pip" install --quiet aiohttp tomlkit
          curl -sSfL -o "$RUNNER_TEMP/flatpak-cargo-generator.py" "$FLATPAK_CARGO_GENERATOR"
          "$RUNNER_TEMP/fcg/bin/python" "$RUNNER_TEMP/flatpak-cargo-generator.py" linux/Cargo.lock -o linux/packaging/flathub/cargo-sources.json

      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flathub-sources
          path: |
            linux/Cargo.lock
            linux/packaging/flathub/cargo-sources.json
          if-no-files-found: error

      - name: Committed files match
        env:
          STALE: ${{ steps.lock.outputs.stale }}
        run: |
          git add -N linux/Cargo.lock linux/packaging/flathub/cargo-sources.json
          if ! git diff --quiet -- linux/Cargo.lock linux/packaging/flathub/cargo-sources.json; then
            git diff --stat -- linux/Cargo.lock linux/packaging/flathub/cargo-sources.json
            echo "::error file=linux/packaging/flathub/cargo-sources.json::cargo-sources.json does not match linux/Cargo.lock. Commit the files from the flathub-sources artifact."
            exit 1
          fi
          test "$STALE" != 1

  flatpak:
    name: Flatpak (x86_64)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    env:
      MANIFEST: linux/packaging/flathub/io.github.pullyard.PullYard.yml
      LOCAL_MANIFEST: linux/packaging/flathub/io.github.pullyard.PullYard.local.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Names
        run: |
          set -a; . linux/brand.env; set +a
          echo "APP_ID=${APP_ID}" >> "$GITHUB_ENV"
          echo "BUNDLE=${APP_NAME}-linux-x86_64.flatpak" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "PULLYARD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Local manifest
        env:
          PULLYARD_UPDATES: app
        run: |
          linux/packaging/flathub/local-manifest.sh "$LOCAL_MANIFEST"
          cat "$LOCAL_MANIFEST"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .flatpak-builder
          key: flathub-${{ hashFiles('linux/packaging/flathub/*.yml', 'linux/packaging/flathub/cargo-sources.json') }}-${{ github.sha }}
          restore-keys: flathub-${{ hashFiles('linux/packaging/flathub/*.yml', 'linux/packaging/flathub/cargo-sources.json') }}-

      - name: Runtime, SDK and Builder
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --install-deps-only builddir "$LOCAL_MANIFEST"
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder

      - name: Download sources
        run: flatpak-builder --user --download-only --force-clean builddir "$LOCAL_MANIFEST"

      - name: Offline build
        run: |
          flatpak-builder --user --sandbox --disable-download --disable-rofiles-fuse --force-clean \
            --default-branch=stable --mirror-screenshots-url=https://dl.flathub.org/media/ \
            --repo=repo builddir "$LOCAL_MANIFEST"
          ls builddir
          if [ -d builddir/screenshots ]; then
            ostree commit --repo=repo --canonical-permissions --branch=screenshots/x86_64 builddir/screenshots
          else
            echo "::warning::builddir/screenshots was not created; screenshots were not mirrored"
          fi

      - name: Flathub lint
        run: |
          lint() {
            flatpak run --command=flatpak-builder-lint org.flatpak.Builder "$@" > "lint-$1.json" || true
            cat "lint-$1.json"
          }
          lint manifest "$MANIFEST"
          lint repo repo
          python3 - lint-manifest.json lint-repo.json <<'PY'
          import json, sys
          pending = {"finish-args-flatpak-spawn-access", "finish-args-home-filesystem-access"}
          failed = False
          for path in sys.argv[1:]:
              kind = path[5:-5]
              raw = open(path).read().strip()
              if not raw:
                  print(f"flatpak-builder-lint {kind}: no findings")
                  continue
              try:
                  data = json.loads(raw)
              except ValueError:
                  print(f"::error::flatpak-builder-lint {kind} produced no report")
                  failed = True
                  continue
              for code in data.get("warnings", []):
                  print(f"::warning::flatpak-builder-lint {kind}: {code}")
              for code in data.get("errors", []):
                  if code in pending:
                      print(f"::warning::flatpak-builder-lint {kind}: {code} (needs a Flathub exception, see the submission notes)")
                  else:
                      print(f"::error::flatpak-builder-lint {kind}: {code}")
                      failed = True
              for line in data.get("info", []):
                  print(f"flatpak-builder-lint {kind} info: {line}")
              if data.get("message"):
                  print(f"flatpak-builder-lint {kind}: {data['message']}")
          sys.exit(1 if failed else 0)
          PY

      - name: Bundle
        run: |
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo "$BUNDLE" "$APP_ID" stable
          ls -la "$BUNDLE"

      - name: Launch check
        run: |
          flatpak install --user -y --noninteractive "$BUNDLE"
          flatpak info --show-permissions "$APP_ID"
          flatpak run "$APP_ID" --version

      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flatpak-x86_64
          path: ${{ env.BUNDLE }}
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -laR artifacts
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG does not exist yet; nothing attached. Re-run this workflow after the release is created."
            exit 0
          fi
          files=$(find artifacts -maxdepth 2 -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.flatpak' \))
          gh release upload "$TAG" $files --clobber --repo "$GITHUB_REPOSITORY"
